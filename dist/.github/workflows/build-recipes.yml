name: Build Recipes
permissions:
  contents: write
on:
  push:
    branches:
      - main
    paths:
      - 'content/recipes/**'
      - 'scripts/**'
      - 'recipes/*template.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add recipes/ fr/recettes/ es/recetas/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-build recipes" && git push origin HEAD:main)
