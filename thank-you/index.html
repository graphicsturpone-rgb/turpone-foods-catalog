<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Turpone Foods</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
        }

        .logo {
            max-width: 200px;
            margin-bottom: 40px;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 50px;
            font-weight: 300;
            margin: 0;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #aaaaaa;
            margin-top: 20px;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #cccccc;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="/">
            <img src="/assets/images/TF-LOgo.svg" alt="Turpone Foods Logo" class="logo">
        </a>
        <div class="icon">✨</div>
        <h1>Message Sent</h1>
        <p>Thank you for reaching out to Turpone Foods. We have received your message securely and our team will get back to you shortly.</p>
        <a href="/" class="btn">Return to Homepage</a>
    </div>

</body>
</html>
